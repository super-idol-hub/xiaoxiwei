name: Deploy remote console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "remote-console/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: remote-console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: remote-console
      - run: pnpm build
        working-directory: remote-console
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote-console/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
